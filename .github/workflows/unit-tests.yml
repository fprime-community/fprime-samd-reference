name: "Unit Tests"

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-ut:
    name: "Native unit tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          filter: blob:none

      - name: "Set up F Prime"
        uses: ./lib/fprime-samd/.github/actions/setup-fprime

      - name: "Generate the native unit-test build cache"
        run: fprime-util generate --ut

      - name: "Build the native-ut all target"
        run: ninja -C build-fprime-automatic-native-ut all

      - name: "Run the unit tests"
        uses: ./lib/fprime-samd/.github/actions/unit-tests
        with:
          preset: native-ut
          build-targets: "false"
