name: 'CuriosityReference CI setup'
description: 'Repository-specific setup invoked by nasa/fprime-actions/external-repository-setup'
inputs:
  stage:
    description: 'Stage being set up: build, int, or all'
    required: false
    default: 'all'
runs:
  using: "composite"
  steps:
    - name: Install fprime-samd CI plugin
      shell: bash
      run: pip install ./lib/fprime-samd/ci
    - name: Install SAMD cross toolchain
      if: ${{ inputs.stage == 'build' || inputs.stage == 'all' }}
      uses: ./lib/fprime-samd/.github/actions/setup-samd-toolchain
      with:
        add-to-path: 'true'
